spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/shareit
    username: shareit_user   # оставляем как было
    password: shareit_pass   # оставляем как было

  jpa:
    hibernate:
      ddl-auto: create  # Создаёт схему при запуске (удобно для разработки)
    properties:
      hibernate:
        format_sql: true  # Форматирует SQL запросы для читаемости
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true  # Показывает SQL в логах

  sql:
    init:
      mode: always  # Всегда выполняет schema.sql

server:
  port: 8080
  address: 0.0.0.0

logging:
  level:
    ru.practicum: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.springframework.orm.jpa: INFO
    org.springframework.transaction: INFO
    org.springframework.transaction.interceptor: TRACE
    org.springframework.orm.jpa.JpaTransactionManager: DEBUG